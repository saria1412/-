name: Build Telegram GIF Cleaner

on:
  push:
    branches:
      - telegram-gif-cleaner
    paths:
      - 'TelegramGifCleaner/**'
      - '.github/workflows/build-telegram-gif-cleaner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages and TDLib build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gperf php-cli ninja-build cmake perl wget unzip
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;23.2.8568313' 'cmake;3.22.1'
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -d "$ANDROID_SDK_ROOT/ndk/23.2.8568313"

      - name: Build official TDLib JSONJava for arm64-v8a
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/tdlib/td.git tdlib-src
          cd tdlib-src
          git checkout d1085f9cebc5a62379991ae1652673954f229c1f
          cd example/android
          sed -i 's/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do/for ABI in arm64-v8a ; do/' build-openssl.sh
          sed -i 's/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do/for ABI in arm64-v8a ; do/' build-tdlib.sh
          ./build-openssl.sh "$ANDROID_SDK_ROOT" '23.2.8568313' "$PWD/openssl" 'OpenSSL_1_1_1w' ''
          ./build-tdlib.sh "$ANDROID_SDK_ROOT" '23.2.8568313' "$PWD/openssl" 'c++_static' 'JSONJava'

      - name: Copy TDLib into Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p TelegramGifCleaner/app/src/main/java/org/drinkless/tdlib
          mkdir -p TelegramGifCleaner/app/src/main/jniLibs/arm64-v8a
          cp tdlib-src/example/android/tdlib/java/org/drinkless/tdlib/JsonClient.java TelegramGifCleaner/app/src/main/java/org/drinkless/tdlib/JsonClient.java
          cp tdlib-src/example/android/tdlib/libs/arm64-v8a/libtdjsonjava.so TelegramGifCleaner/app/src/main/jniLibs/arm64-v8a/libtdjsonjava.so
          test -s TelegramGifCleaner/app/src/main/jniLibs/arm64-v8a/libtdjsonjava.so

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper
        working-directory: TelegramGifCleaner
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Build Debug APK
        working-directory: TelegramGifCleaner
        run: ./gradlew --no-daemon clean :app:assembleDebug

      - name: Verify APK and privacy surface
        shell: bash
        run: |
          set -euxo pipefail
          cp TelegramGifCleaner/app/build/outputs/apk/debug/app-debug.apk TelegramGifCleaner.apk
          unzip -t TelegramGifCleaner.apk
          unzip -l TelegramGifCleaner.apk | grep 'lib/arm64-v8a/libtdjsonjava.so'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump permissions TelegramGifCleaner.apk | tee apk-permissions.txt
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          if grep -E 'android.permission.(READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|CAMERA|RECORD_AUDIO|READ_PHONE_STATE)' apk-permissions.txt; then
            echo 'Unexpected sensitive Android permission found'
            exit 1
          fi
          if grep -RniE '^[[:space:]]*(implementation|api|classpath)[[:space:]]*\(' TelegramGifCleaner --include='*.gradle' --include='*.gradle.kts' | grep -Ei 'firebase|analytics|crashlytics|appcenter|facebook|adjust|amplitude|mixpanel|sentry|okhttp|retrofit'; then
            echo 'Unexpected analytics/tracker/network SDK dependency found'
            exit 1
          fi
          if grep -RniE 'api_hash[^0-9a-fA-F]{0,24}[0-9a-fA-F]{32}' TelegramGifCleaner/app/src/main; then
            echo 'Hard-coded API hash found'
            exit 1
          fi
          sha256sum TelegramGifCleaner.apk | tee TelegramGifCleaner.apk.sha256

      - name: Package full project ZIP
        shell: bash
        run: |
          rm -rf TelegramGifCleaner/app/build TelegramGifCleaner/build TelegramGifCleaner/.gradle
          zip -qr TelegramGifCleaner-project.zip TelegramGifCleaner
          unzip -t TelegramGifCleaner-project.zip

      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: TelegramGifCleaner-final
          path: |
            TelegramGifCleaner.apk
            TelegramGifCleaner.apk.sha256
            apk-permissions.txt
            TelegramGifCleaner-project.zip
          if-no-files-found: error
          retention-days: 30
