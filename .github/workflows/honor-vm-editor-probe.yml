name: HONOR Project Open From Local Folder
on:
  push:
    branches: [honor-qasioun-virtual-editor-20261009]
    paths: ['.github/workflows/honor-vm-editor-probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  open-project:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Restore actual official editor project
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force report,previous | Out-Null
          gh run download 37885474600 --repo 'saria1412/-' --name 'HONOR-GUI-Export-Qasioun-Report' --dir previous
          $dest="$env:APPDATA/HnThemeEditor/workspace"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Expand-Archive previous/HONOR_EDITOR_IMPORTED_PROJECT.zip -DestinationPath $dest -Force
          $proj=Get-ChildItem $dest -Directory | Where-Object {$_.Name -like 'GitHub_R02_Seed*'} | Select-Object -First 1
          if(-not $proj) {throw 'Theme project missing'}
          "Project directory: $($proj.FullName)" | Out-File report/project_path.txt
      - name: Install official theme editor
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://contentplatform-drcn.hihonorcdn.com/developerPlatform/HnThemeEditor_2.5.0.exe' -OutFile setup.exe -TimeoutSec 600
          $p=Start-Process -FilePath "$pwd/setup.exe" -ArgumentList '/S' -PassThru
          if(-not $p.WaitForExit(190000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          if(-not (Test-Path "$env:LOCALAPPDATA/Programs/HnThemeEditor/HnThemeEditor.exe")){throw 'Editor missing'}
      - name: Open project folder through GUI
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;using System.Runtime.InteropServices;
          public class VMouse{
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int a,int b,int c,int d,int e);
          }
          '@
          function Click([int]$x,[int]$y){
            [VMouse]::SetCursorPos($x,$y)|Out-Null
            [VMouse]::mouse_event(2,0,0,0,0)
            Start-Sleep -Milliseconds 140
            [VMouse]::mouse_event(4,0,0,0,0)
          }
          function Shot([string]$name){
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X,$b.Y,0,0,$b.Size)
            $bmp.Save("report/$name.png",[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$bmp.Dispose()
          }
          function DumpUI([string]$label){
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $windows=$root.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
            foreach($win in $windows){
              try {
                "$($win.Current.Name)|$($win.Current.ClassName)|$($win.Current.BoundingRectangle)" | Add-Content "report/UI_$label.txt"
                if($win.Current.Name -match 'Open|Select|Browse|Theme|Folder|Directory|打开'){
                  $nodes=$win.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
                  for($i=0;$i -lt [Math]::Min($nodes.Count,300);$i++){
                    $c=$nodes[$i].Current
                    "$i|$($c.Name)|$($c.AutomationId)|$($c.ControlType.ProgrammaticName)|$($c.BoundingRectangle)"| Add-Content "report/UI_$label.txt"
                  }
                }
              } catch {}
            }
          }
          $exe="$env:LOCALAPPDATA/Programs/HnThemeEditor/HnThemeEditor.exe"
          Start-Process $exe -ArgumentList @('--remote-debugging-port=9222','--remote-allow-origins=*')|Out-Null
          Start-Sleep 22
          Shot '01_home'
          Click 184 454
          Start-Sleep 2
          Shot '02_open_tab'
          Click 695 569
          Start-Sleep 3
          Shot '03_folder_picker'
          DumpUI 'picker'
          $dir=(Get-ChildItem "$env:APPDATA/HnThemeEditor/workspace" -Directory | Where-Object {$_.Name -like 'GitHub_R02_Seed*'}|Select-Object -First 1).FullName
          [System.Windows.Forms.SendKeys]::SendWait('^l')
          Start-Sleep -Milliseconds 250
          [System.Windows.Forms.SendKeys]::SendWait($dir)
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep 3
          Shot '04_after_path'
          DumpUI 'after_path'
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep 9
          Shot '05_after_select_folder'
          DumpUI 'after_select'
          Click 575 63
          Start-Sleep 3
          Shot '06_after_export_click'
          DumpUI 'after_export'
          Get-ChildItem "$env:APPDATA/HnThemeEditor/workspace" -Directory |Select-Object Name,FullName|Format-Table|Out-String|Out-File report/workspace_folders.txt
      - name: Save GUI exploration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HONOR-GUI-Open-Local-Project-Results
          path: report/
          if-no-files-found: warn
          retention-days: 7
