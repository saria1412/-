name: HONOR Qasioun MagicOS10 Fresh Template
on:
  push:
    branches: [honor-qasioun-virtual-editor-20261009]
    paths: ['.github/workflows/honor-vm-editor-probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  create:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Restore design project inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force report,source | Out-Null
          gh run download 37885474600 --repo 'saria1412/-' --name 'HONOR-GUI-Export-Qasioun-Report' --dir source
          Expand-Archive source/HONOR_EDITOR_IMPORTED_PROJECT.zip -DestinationPath source/imported -Force
          $a=Get-ChildItem source/imported -Directory | Where-Object {$_.Name -like 'GitHub_R02_Seed*'} |Select-Object -First 1
          if(-not $a){throw 'Missing source theme'}
          "SOURCE=$($a.FullName)" | Out-File report/source_path.txt
      - name: Install official editor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://contentplatform-drcn.hihonorcdn.com/developerPlatform/HnThemeEditor_2.5.0.exe' -OutFile setup.exe -TimeoutSec 600
          $p=Start-Process "$pwd/setup.exe" -ArgumentList '/S' -PassThru
          if(-not $p.WaitForExit(200000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          if(-not(Test-Path "$env:LOCALAPPDATA/Programs/HnThemeEditor/HnThemeEditor.exe")){throw 'HONOR editor missing'}
          npm install --no-save playwright@1.55.1 | Out-File report/npm.txt
      - name: Create actual new MagicOS template
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Process "$env:LOCALAPPDATA/Programs/HnThemeEditor/HnThemeEditor.exe" -ArgumentList @('--remote-debugging-port=9222','--remote-allow-origins=*') | Out-Null
          Start-Sleep -Seconds 18
          @'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{
            let browser;
            try{
              browser=await chromium.connectOverCDP('http://127.0.0.1:9222');
              const p=browser.contexts().flatMap(c=>c.pages()).find(x=>x.url().startsWith('file:'));
              if(!p)throw Error('Electron page missing');
              await p.getByText('New',{exact:true}).first().evaluate(n=>n.click());
              await p.waitForTimeout(1200);
              await p.locator('input[placeholder="Enter the default resource name"]').fill('Syria Qasioun Morning');
              await p.locator('input[placeholder="Enter the designer\'s name"]').fill('Qasioun Theme Studio');
              await p.locator('textarea').first().fill('Morning Damascus and Mount Qasioun - Syrian flag. No embedded text.');
              await p.screenshot({path:'report/01_new_form.png'});
              const versions={};
              const versionInput=p.locator('input[placeholder="Select"]').first();
              await versionInput.evaluate(n=>n.click());
              await p.waitForTimeout(600);
              versions.body=(await p.locator('body').innerText()).slice(0,25000);
              await p.screenshot({path:'report/02_versions.png'});
              const choices=['MagicOS 10.0','MagicOS 10','MagicOS 9.0','MagicOS 9','MagicOS 8.0'];
              let selected='';
              for(const label of choices){
                const options=p.getByText(label,{exact:true});
                let count=await options.count();
                for(let k=count-1;k>=0;k--){
                  if(await options.nth(k).isVisible()){
                    await options.nth(k).evaluate(n=>n.click());
                    selected=label;break;
                  }
                }
                if(selected)break;
              }
              versions.selected=selected;
              fs.writeFileSync('report/versions.json',JSON.stringify(versions,null,2));
              await p.getByText('Next',{exact:true}).last().evaluate(n=>n.click());
              await p.waitForTimeout(1100);
              await p.screenshot({path:'report/03_template_choice.png'});
              fs.writeFileSync('report/03_template_text.txt',(await p.locator('body').innerText()).slice(0,30000));
              const noTemplate=p.getByText('No template',{exact:true});
              if((await noTemplate.count())>0)await noTemplate.last().evaluate(n=>n.click());
              const confirm=p.getByText('Confirm',{exact:true}).last();
              if(!(await confirm.count()))throw Error('Confirm not found in template selection');
              await confirm.evaluate(n=>n.click());
              await p.waitForTimeout(14500);
              await p.screenshot({path:'report/04_after_confirm.png'});
              fs.writeFileSync('report/04_after_confirm_text.txt',(await p.locator('body').innerText()).slice(0,30000));
              const exp=p.getByText('Export',{exact:true}).first();
              fs.writeFileSync('report/export_button_count.txt',String(await exp.count()));
              if(!(await exp.count()))throw Error('Editor project was not opened after creation');
              fs.writeFileSync('report/RESULT.txt','CREATED PROJECT IN OFFICIAL EDITOR '+selected);
            }catch(e){fs.writeFileSync('report/ERROR.txt',String(e.stack||e));process.exitCode=1;}
            finally{if(browser)await browser.close()}
          })();
          '@ | Set-Content -Encoding UTF8 create_honor.js
          node create_honor.js
      - name: Capture project files and screenshots
        if: always()
        shell: pwsh
        run: |
          $workspace="$env:APPDATA/HnThemeEditor/workspace"
          $projects=Get-ChildItem $workspace -Directory -ErrorAction SilentlyContinue|Where-Object {$_.Name -ne '.design'}
          $projects|Select-Object Name,FullName|Format-Table|Out-String|Set-Content report/projects.txt
          foreach($proj in $projects){
            if($proj.Name -like '*Qasioun*'){
              Compress-Archive -Path $proj.FullName -DestinationPath report/HONOR_FRESH_MAGICOS_PROJECT.zip -CompressionLevel Optimal
              "PROJECT ARCHIVE $((Get-Item report/HONOR_FRESH_MAGICOS_PROJECT.zip).Length)"|Add-Content report/projects.txt
              Get-ChildItem $proj.FullName -Recurse -File|Select-Object -First 600 -ExpandProperty FullName|Out-File report/project_files.txt
              break
            }
          }
      - name: Export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HONOR-Qasioun-Template-Creation-Verified
          path: report/
          if-no-files-found: warn
          retention-days: 7
