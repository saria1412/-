name: HONOR Editor MagicOS 10 Project Conversion Probe
on:
  push:
    branches: [honor-qasioun-virtual-editor-20261009]
    paths: ['.github/workflows/honor-vm-editor-probe.yml']
permissions:
  contents: read
jobs:
  magic10-convert:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Download project assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force report,assets | Out-Null
          Invoke-WebRequest -Uri 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-1d9c-8208-8462-332081dbf22e/raw?se=2026-10-09T05%3A09%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=c322b8d4-15b6-5098-a9c3-aa61e6addbe2&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A32%3A53Z&ske=2026-10-10T01%3A32%3A53Z&sks=b&skv=2026-02-06&sig=dgVq5dtHABnxTdqBtRK9hhnsUmQMhlP0EGBKudiTBUM%3D' -OutFile assets.zip -TimeoutSec 150
          Expand-Archive assets.zip -DestinationPath assets -Force
          if(-not (Test-Path 'assets/06_Import_Seed_Optional/GitHub_R02_Seed.hnt')) {throw 'Seed file missing'}
      - name: Install official HONOR editor
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://contentplatform-drcn.hihonorcdn.com/developerPlatform/HnThemeEditor_2.5.0.exe' -OutFile setup.exe -TimeoutSec 600
          $proc=Start-Process "$pwd/setup.exe" -ArgumentList '/S' -PassThru
          if(-not $proc.WaitForExit(210000)){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
          if(-not (Test-Path "$env:LOCALAPPDATA/Programs/HnThemeEditor/HnThemeEditor.exe")) {throw 'Editor not installed'}
          npm install --no-save playwright@1.55.1 | Out-File report/npm.txt
      - name: Import seed and navigate project conversion controls
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;using System.Runtime.InteropServices;
          public class MClick {
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
          [DllImport("user32.dll")] public static extern void mouse_event(int flags,int dx,int dy,int data,int ext);
          }
          '@
          function Click([int]$x,[int]$y) {
            [MClick]::SetCursorPos($x,$y)|Out-Null
            [MClick]::mouse_event(2,0,0,0,0)
            Start-Sleep -Milliseconds 140
            [MClick]::mouse_event(4,0,0,0,0)
          }
          $exe="$env:LOCALAPPDATA/Programs/HnThemeEditor/HnThemeEditor.exe"
          Start-Process $exe -ArgumentList @('--remote-debugging-port=9222','--remote-allow-origins=*')|Out-Null
          Start-Sleep -Seconds 23
          Click 140 554
          Start-Sleep -Seconds 5
          $src=(Resolve-Path 'assets/06_Import_Seed_Optional/GitHub_R02_Seed.hnt').Path
          [System.Windows.Forms.SendKeys]::SendWait($src)
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 8
          Click 780 439
          Start-Sleep -Seconds 35
          @'
          const fs=require('fs'), {chromium}=require('playwright');
          (async()=>{
            try{
              const b=await chromium.connectOverCDP('http://127.0.0.1:9222');
              const pages=b.contexts().flatMap(c=>c.pages());
              const p=pages.find(x=>x.url().startsWith('file:'))||pages[0];
              if(!p) throw new Error('Missing editor page');
              fs.writeFileSync('report/in_editor.txt',(await p.locator('body').innerText()).slice(0,20000));
              const btn=p.getByText('Homepage',{exact:true});
              fs.writeFileSync('report/home_button_count.txt',String(await btn.count()));
              await btn.first().click({timeout:4000});
              await p.waitForTimeout(2500);
              await p.screenshot({path:'report/01_homepage.png'});
              fs.writeFileSync('report/homepage_text.txt',(await p.locator('body').innerText()).slice(0,25000));
              fs.writeFileSync('report/homepage_links.json',JSON.stringify(await p.locator('a,button,[title],[aria-label]').evaluateAll(ns=>ns.map(n=>({tag:n.tagName,html:n.outerHTML.slice(0,700)})).slice(0,260)),null,2));
              const pn=p.getByText('GitHub_R02_Seed',{exact:false});
              const count=await pn.count();
              fs.writeFileSync('report/project_match_count.txt',String(count));
              if(count) {
                const q=pn.last();
                await q.hover({timeout:3500});
                await p.waitForTimeout(650);
                await p.screenshot({path:'report/02_card_hovered.png'});
                fs.writeFileSync('report/project_parent_html.txt',await q.evaluate(n=>n.parentElement?.parentElement?.parentElement?.outerHTML.slice(0,14000)||''));
                fs.writeFileSync('report/project_dom_text.txt',(await p.locator('body').innerText()).slice(0,25000));
              }
              fs.writeFileSync('report/project_visible_buttons.json',JSON.stringify(await p.locator('button').evaluateAll(ns=>ns.map(n=>({text:(n.innerText||'').slice(0,100),title:n.title,html:n.outerHTML.slice(0,500),rect:(()=>{const r=n.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}})()}))),null,2));
              await b.close();
            }catch(e){fs.writeFileSync('report/error.txt',String(e.stack||e));}
          })();
          '@ | Set-Content -Encoding UTF8 inspect_home.js
          node inspect_home.js
      - name: Upload conversion probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HONOR-MagicOS10-Version-Conversion-Inspection
          path: report/
          retention-days: 7
