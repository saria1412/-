name: HONOR HnThemeEditor Windows VM probe
on:
  push:
    branches: [honor-qasioun-virtual-editor-20261009]
    paths: ['.github/workflows/honor-vm-editor-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Environment diagnostic
        run: |
          New-Item -ItemType Directory -Force report | Out-Null
          "OS: $([System.Environment]::OSVersion.VersionString)" | Out-File report/environment.txt
          "PowerShell: $($PSVersionTable.PSVersion)" | Add-Content report/environment.txt
          "Screen interactive: $([Environment]::UserInteractive)" | Add-Content report/environment.txt
      - name: Install browser automation dependencies
        run: |
          npm install --no-save playwright@1.55.1 | Out-File report/npm-output.txt
          npx playwright install chromium | Out-File report/playwright-output.txt
      - name: Inspect official HONOR editor site
        run: |
          @'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1366,height:950},acceptDownloads:true,locale:'zh-CN'});
            page.on('console',m=> {if(m.type()==='error') fs.appendFileSync('report/console-errors.txt',m.text()+'\n')});
            page.on('response',r=> {if(r.url().includes('honor') && r.status()>=400)fs.appendFileSync('report/http-errors.txt',r.status()+' '+r.url()+'\n')});
            try {
              await page.goto('https://developer.honor.com/cn/kitdoc/content/11106/guides/themetool.md',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(14000);
              await page.screenshot({path:'report/official_page.png',fullPage:false});
              fs.writeFileSync('report/final_url.txt',page.url());
              fs.writeFileSync('report/body_text.txt',(await page.locator('body').innerText()).slice(0,45000));
              const links=await page.locator('a').evaluateAll(nodes=>nodes.map(n=>({text:(n.innerText||n.textContent||'').trim().slice(0,150),href:n.href,download:n.download})).filter(x=>x.text||x.href));
              fs.writeFileSync('report/links.json',JSON.stringify(links,null,2));
              const buttons=await page.locator('button').evaluateAll(nodes=>nodes.map(n=>({text:(n.innerText||n.textContent||'').trim().slice(0,150),outerHTML:n.outerHTML.slice(0,500)})));
              fs.writeFileSync('report/buttons.json',JSON.stringify(buttons,null,2));
              const cands=page.getByText('Windows版本',{exact:false});
              fs.writeFileSync('report/candidate_count.txt',String(await cands.count()));
              if((await cands.count())>0){
                const parent=cands.first().locator('xpath=..');
                fs.writeFileSync('report/candidate_html.txt',(await parent.evaluate(n=>n.outerHTML)).slice(0,5000));
                const a=parent.locator('a').first();
                if((await a.count())>0){
                  let candidateUrl=await a.getAttribute('href');
                  fs.writeFileSync('report/candidate_href.txt',String(candidateUrl));
                  if(candidateUrl && /^https?:/.test(candidateUrl) && /honor|hihonor/.test(new URL(candidateUrl).hostname)){
                    fs.writeFileSync('report/official_candidate_url.txt',candidateUrl);
                  }
                }
              }
              fs.writeFileSync('report/success.txt','Official page inspected with browser');
            }catch(e){fs.writeFileSync('report/probe_error.txt',String(e.stack||e));process.exitCode=1;}
            finally{await browser.close();}
          })();
          '@ | Set-Content -Encoding UTF8 probe.js
          node probe.js
      - name: Inspect HONOR download page
        run: |
          @'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:950},acceptDownloads:true,locale:'zh-CN'});
            try{
              await page.goto('https://developer.honor.com/cn/docs/11106/guides/download',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(16000);
              fs.writeFileSync('report/download_page_url.txt',page.url());
              fs.writeFileSync('report/download_page_text.txt',(await page.locator('body').innerText()).slice(0,50000));
              fs.writeFileSync('report/download_page_links.json',JSON.stringify(await page.locator('a').evaluateAll(ns=>ns.map(n=>({text:(n.innerText||n.textContent||'').trim().slice(0,120),href:n.href}))),null,2));
              fs.writeFileSync('report/download_page_buttons.json',JSON.stringify(await page.locator('button').evaluateAll(ns=>ns.map(n=>({text:(n.innerText||n.textContent||'').trim().slice(0,120),outer:n.outerHTML.slice(0,700)}))),null,2));
              await page.screenshot({path:'report/download_page.png',fullPage:false});
              fs.writeFileSync('report/download_page_success.txt','download page inspected');
            }catch(e){fs.writeFileSync('report/download_page_error.txt',String(e.stack||e));process.exitCode=1;}
            finally{await browser.close();}
          })();
          '@ | Set-Content -Encoding UTF8 probe_download.js
          node probe_download.js
      - name: Download verify install and launch official HnThemeEditor
        run: |
          $ErrorActionPreference='Continue'
          $url='https://contentplatform-drcn.hihonorcdn.com/developerPlatform/HnThemeEditor_2.5.0.exe'
          $installer=Join-Path $pwd 'HnThemeEditor_2.5.0.exe'
          "Official URL: $url" | Out-File report/install_log.txt
          try {
            Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 600
            $p=Get-Item $installer
            "Downloaded bytes: $($p.Length)" | Add-Content report/install_log.txt
            "SHA256: $((Get-FileHash $installer -Algorithm SHA256).Hash)" | Add-Content report/install_log.txt
            $s=Get-AuthenticodeSignature $installer
            "Authenticode: $($s.Status)" | Add-Content report/install_log.txt
            "Signer: $($s.SignerCertificate.Subject)" | Add-Content report/install_log.txt
            if($p.Length -lt 3000000){ throw 'Unexpected tiny installer size' }
            $proc=Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
            if(-not $proc.WaitForExit(180000)){
              "Installer timed out at 180s" | Add-Content report/install_log.txt
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            } else {
              "Installer exit code: $($proc.ExitCode)" | Add-Content report/install_log.txt
            }
            Start-Sleep 8
            $paths=@("$env:LOCALAPPDATA\Programs", "$env:LOCALAPPDATA", "$env:ProgramFiles")
            foreach($dir in $paths){
              if(Test-Path $dir){
                Get-ChildItem $dir -Filter 'HnThemeEditor.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-File -Append report/editor_paths.txt
              }
            }
            Get-Process | Where-Object { $_.ProcessName -match 'HnTheme|ThemeEditor' } | Select-Object Name, Id, Path, MainWindowTitle | Format-Table | Out-String | Add-Content report/install_log.txt
            if(Test-Path report/editor_paths.txt){
              $exe=(Get-Content report/editor_paths.txt | Where-Object {$_ -and (Test-Path $_)} | Select-Object -First 1)
              if($exe){
                "Launching $exe" | Add-Content report/install_log.txt
                $app=Start-Process -FilePath $exe -PassThru
                Start-Sleep 20
                Get-Process | Where-Object { $_.ProcessName -match 'HnTheme|ThemeEditor' } | Select-Object Name, Id, Path, MainWindowTitle | Format-Table | Out-String | Add-Content report/install_log.txt
              }
            }
            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
              $g=[System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.X,$b.Y,0,0,$b.Size)
              $bmp.Save('report/editor_desktop.png',[System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose();$bmp.Dispose()
              "Captured virtual desktop $($b.Width)x$($b.Height)" | Add-Content report/install_log.txt
            }catch{ "Screenshot failure: $($_.Exception.Message)" | Add-Content report/install_log.txt }
          }catch{
            "ERROR: $($_.Exception.Message)" | Add-Content report/install_log.txt
            exit 1
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HONOR-Windows-VM-Official-Editor-Probe
          path: report/
          if-no-files-found: warn
          retention-days: 7
