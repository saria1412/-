name: Build Qasioun Umayyad Prayer v0.2
on:
  push:
    branches:
      - 'qasioun-prayer-widget-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract app project
        run: |
          mkdir -p QasiounPrayer
          echo '69c95e5aa11188db948f0622f69864b02061d2a9b1765aa36ccc7c7a11100fd6  QasiounPrayer_Source.zip' | sha256sum -c -
          unzip -q QasiounPrayer_Source.zip -d QasiounPrayer
          test -s QasiounPrayer/app/src/main/AndroidManifest.xml
      - name: Download verified CC0 Adhan
        run: |
          mkdir -p QasiounPrayer/app/src/main/res/raw
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'QasiounPrayerCI/1.0' \
            'https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg' \
            -o QasiounPrayer/app/src/main/res/raw/adhan.ogg
          echo 'a1fa4fd942401922c5c3301816384aae86956522  QasiounPrayer/app/src/main/res/raw/adhan.ogg' | sha1sum -c -
          test $(stat -c%s QasiounPrayer/app/src/main/res/raw/adhan.ogg) -gt 1000000
      - name: Verify approved Umayyad icon and app version
        run: |
          test -s QasiounPrayer/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          test ! -e QasiounPrayer/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo '3f490f7ecf245c488018f1d4f482650b473731d57a551b341dd3ebc6e8c660c4  QasiounPrayer/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp' | sha256sum -c -
          grep -q 'versionCode 2' QasiounPrayer/app/build.gradle
          grep -q "versionName '0.2.0-umayyad-beta'" QasiounPrayer/app/build.gradle
      - name: Native Java unit tests
        working-directory: QasiounPrayer
        run: bash tests/run.sh
      - name: Build APK and lint
        working-directory: QasiounPrayer
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Print lint diagnostics if a build fails
        if: failure()
        run: |
          f=QasiounPrayer/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if test -f "$f"; then grep -n -B 1 -A 4 -E 'Error:|errors, [0-9]+ warnings' "$f" || true; fi
      - name: Inspect APK signature and manifest
        run: |
          set -euo pipefail
          mkdir -p release
          cp QasiounPrayer/app/build/outputs/apk/debug/app-debug.apk release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk
          unzip -t release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk | tail -1
          test "$(unzip -l release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk | grep -c classes.dex)" -gt 0
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk
          unzip -Z1 release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk | grep -q 'ic_launcher.webp'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk | grep -F "versionName='0.2.0-umayyad-beta'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk | grep -F "package: name='com.sarf.qasioun.prayer'"
          sha256sum release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk > release/Qasioun-Prayer-MagicOS10-Umayyad-v0.2.0-BETA.apk.sha256
          cp QasiounPrayer/README_AR.md release/README_AR.md
      - uses: actions/upload-artifact@v4
        with:
          name: Qasioun-Umayyad-v02-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14