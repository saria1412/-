name: Qasioun Prayer APK (MagicOS 10)
on:
  push:
    branches:
      - 'qasioun-prayer-widget-*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract verified source
        run: |
          set -euo pipefail
          base64 -d qasioun-prayer-widget/source.b64 > /tmp/qasioun-src.zip
          unzip -t /tmp/qasioun-src.zip | tail -1
          mkdir -p QasiounPrayer
          unzip -q /tmp/qasioun-src.zip -d QasiounPrayer
          test -s QasiounPrayer/app/src/main/AndroidManifest.xml
          test -f QasiounPrayer/app/src/main/java/com/sarf/qasioun/prayer/MainActivity.java
      - name: Download CC0 Adhan (SHA1 pinned)
        run: |
          set -euo pipefail
          mkdir -p QasiounPrayer/app/src/main/res/raw
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'QasiounPrayerCI/1.0' \
            'https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg' \
            -o QasiounPrayer/app/src/main/res/raw/adhan.ogg
          echo 'a1fa4fd942401922c5c3301816384aae86956522  QasiounPrayer/app/src/main/res/raw/adhan.ogg' | sha1sum -c -
          test "$(stat -c%s QasiounPrayer/app/src/main/res/raw/adhan.ogg)" -gt 1000000
      - name: Java and static tests
        working-directory: QasiounPrayer
        run: bash tests/run.sh
      - name: Compile, package, lint
        working-directory: QasiounPrayer
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Verify signed APK and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp QasiounPrayer/app/build/outputs/apk/debug/app-debug.apk release/Qasioun-Prayer-MagicOS10-BETA.apk
          unzip -t release/Qasioun-Prayer-MagicOS10-BETA.apk | tail -1
          unzip -l release/Qasioun-Prayer-MagicOS10-BETA.apk | grep -E 'classes[0-9]*\.dex'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/Qasioun-Prayer-MagicOS10-BETA.apk
          sha256sum release/Qasioun-Prayer-MagicOS10-BETA.apk > release/Qasioun-Prayer-MagicOS10-BETA.apk.sha256
          cp QasiounPrayer/README_AR.md release/README_AR.md
      - uses: actions/upload-artifact@v4
        with:
          name: Qasioun-Prayer-MagicOS10-APK
          path: release/*
          retention-days: 14
          if-no-files-found: error
