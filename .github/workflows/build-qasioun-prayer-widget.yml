name: Build SARF Qasioun Prayer Widget
on:
  push:
    branches:
      - 'qasioun-prayer-widget-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract app project
        run: |
          mkdir -p QasiounPrayer
          unzip -q QasiounPrayer_Source.zip -d QasiounPrayer
          test -s QasiounPrayer/app/src/main/AndroidManifest.xml
      - name: Download verified CC0 Adhan
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'QasiounPrayerCI/1.0' \
            'https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg' \
            -o QasiounPrayer/app/src/main/res/raw/adhan.ogg
          echo 'a1fa4fd942401922c5c3301816384aae86956522  QasiounPrayer/app/src/main/res/raw/adhan.ogg' | sha1sum -c -
          test $(stat -c%s QasiounPrayer/app/src/main/res/raw/adhan.ogg) -gt 1000000
      - name: Native Java unit tests
        working-directory: QasiounPrayer
        run: bash tests/run.sh
      - name: Build APK and lint
        working-directory: QasiounPrayer
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Inspect APK signature and manifest
        run: |
          set -euo pipefail
          mkdir -p release
          cp QasiounPrayer/app/build/outputs/apk/debug/app-debug.apk release/SARF-Qasioun-Prayer-Widget-0.1.0-BETA.apk
          unzip -t release/SARF-Qasioun-Prayer-Widget-0.1.0-BETA.apk | tail -1
          test "$(unzip -l release/SARF-Qasioun-Prayer-Widget-0.1.0-BETA.apk | grep -c classes.dex)" -gt 0
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/SARF-Qasioun-Prayer-Widget-0.1.0-BETA.apk
          sha256sum release/SARF-Qasioun-Prayer-Widget-0.1.0-BETA.apk > release/SARF-Qasioun-Prayer-Widget-0.1.0-BETA.apk.sha256
          cp QasiounPrayer/README_AR.md release/README_AR.md
      - uses: actions/upload-artifact@v4
        with:
          name: SARF-Qasioun-Prayer-Widget-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14