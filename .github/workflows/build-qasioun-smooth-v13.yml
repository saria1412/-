name: Build Qasioun Smooth Cloth V1.3
on:
  push:
    branches:
      - qasioun-auto-wallpaper-v13-smooth-cloth
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check cloth, background de-ghosting, and sunrise switching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          app=Path('QasiounAutoWallpaper/app')
          src=app/'src/main/java/com/sarf/qasioun/wallpaper'
          for xml in app.rglob('*.xml'): ET.parse(xml)
          service=(src/'QasiounWallpaperService.java').read_text()
          sky=(src/'SkyRestorer.java').read_text()
          motion=(src/'FlagMotion.java').read_text()
          assert 'FRAME_INTERVAL_MS=33L' in service
          assert 'new FlagOverlay(original,isNight)' in service
          assert 'SkyRestorer.erase(original,isNight)' in service
          assert 'original.recycle()' in service
          assert 'SolarClock.isNight' in service
          assert 'UI_MODE_NIGHT' not in service
          assert 'LOOP_SECONDS=8.0' in motion
          assert 'getPixels(buffer' in sky
          assert 'original.getPixels' in sky
          assert 'setPixels(result' in sky
          assert 'new Bitmap' not in sky
          store=(src/'ThemeStorage.java').read_text()
          assert '"wallpaper/unlock_wallpaper_0.jpg"' in store
          assert 'versionCode 4' in (app/'build.gradle').read_text()
          assert "versionName '1.3.0-smooth-cloth-beta'" in (app/'build.gradle').read_text()
          print('PASS: R13 photo import, static flag removal, wave loop, solar switch, XML')
          PY
      - name: Test 8s seamless multi-harmonic flag and solar calculations
        run: |
          mkdir -p /tmp/qasioun-flag-test
          javac -encoding UTF-8 -d /tmp/qasioun-flag-test \
            QasiounAutoWallpaper/app/src/main/java/com/sarf/qasioun/wallpaper/SolarClock.java \
            QasiounAutoWallpaper/tests/SolarClockTest.java \
            QasiounAutoWallpaper/app/src/main/java/com/sarf/qasioun/wallpaper/FlagMotion.java \
            QasiounAutoWallpaper/tests/FlagMotionTest.java
          java -cp /tmp/qasioun-flag-test SolarClockTest
          java -cp /tmp/qasioun-flag-test FlagMotionTest
      - name: Compile and run Android lint
        working-directory: QasiounAutoWallpaper
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Print lint diagnostics
        if: failure()
        run: |
          f=QasiounAutoWallpaper/app/build/reports/lint-results-debug.txt
          test ! -f "$f" || grep -n -B2 -A5 'Error:' "$f" || true
      - name: Inspect signed APK
        run: |
          set -euo pipefail
          mkdir -p release
          apk=release/Qasioun_Solar_Realistic_Flag_v1.3.0_BETA.apk
          cp QasiounAutoWallpaper/app/build/outputs/apk/debug/app-debug.apk "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.sarf.qasioun.wallpaper'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "versionName='1.3.0-smooth-cloth-beta'"
          unzip -Z1 "$apk" | grep -q 'classes.dex'
          sha256sum "$apk" > "$apk.sha256"
          cp QasiounAutoWallpaper/README_AR.md release/README_AR.md
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Qasioun-Solar-Realistic-Flag-V13-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
