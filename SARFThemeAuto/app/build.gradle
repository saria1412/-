plugins { id 'com.android.application' }
android {
  namespace 'com.sarf.engineering.themeswitch'
  compileSdk 35
  defaultConfig {
    applicationId 'com.sarf.engineering.themeswitch'
    minSdk 30
    targetSdk 35
    versionCode 1
    versionName '0.1.0-honor-theme-auto-beta'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  lint { abortOnError true }
}
