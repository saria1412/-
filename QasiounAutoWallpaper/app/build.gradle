plugins { id 'com.android.application' }
android {
    namespace 'com.sarf.qasioun.wallpaper'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sarf.qasioun.wallpaper'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.3.0-smooth-cloth-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
